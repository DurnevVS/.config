"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
scan_timeout = 30
palette = 'catppuccin_mocha'
format = """
[╭─](surface2) $directory$git_branch$git_status$git_state$python$nodejs$rust$golang$cmd_duration$status
[╰─](surface2) $character"""

[directory]
style = 'bold blue'
format = '[ $path]($style)[$read_only]($read_only_style) '
read_only = ' '
read_only_style = 'red'
truncation_length = 4
truncation_symbol = '…/'
truncate_to_repo = true

[git_branch]
symbol = ' '
style = 'bold mauve'
format = '[$symbol$branch]($style) '
truncation_length = 30
truncation_symbol = '…'

[git_status]
style = 'peach'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '=$count '
ahead = '↑$count '
behind = '↓$count '
diverged = '↑$ahead_count ↓$behind_count '
untracked = '?$count '
stashed = '\$$count '
modified = '!$count '
staged = '+$count '
renamed = '»$count '
deleted = '✘$count '

[git_state]
style = 'bold yellow'
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[python]
symbol = ' '
style = 'green'
format = '[$symbol$version( \($virtualenv\))]($style) '

[nodejs]
symbol = ' '
style = 'green'
format = '[$symbol$version]($style) '

[rust]
symbol = ' '
style = 'peach'
format = '[$symbol$version]($style) '

[golang]
symbol = ' '
style = 'teal'
format = '[$symbol$version]($style) '

[cmd_duration]
min_time = 2000
style = 'yellow'
format = '[󱎫 $duration]($style) '
show_notifications = false

[status]
disabled = false
symbol = '✘ '
style = 'bold red'
format = '[$symbol$status]($style) '

[character]
success_symbol = '[❯](bold mauve)'
error_symbol = '[❯](bold red)'

[palettes.catppuccin_mocha]
red = '#f38ba8'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
blue = '#89b4fa'
mauve = '#cba6f7'
surface2 = '#585b70'
