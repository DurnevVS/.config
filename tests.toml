[[tests]]
id = 'profile_uses_selected_configuration_root'
action = 'profile_env'
[tests.input]
root_name = 'config with spaces'
root_marker = '{config}'
environment_names = ['XDG_CONFIG_HOME', 'CODEX_HOME', 'YAZI_CONFIG_HOME', 'GLOW_CONFIG_HOME', 'GH_CONFIG_DIR', 'MICRO_CONFIG_HOME', 'STARSHIP_CONFIG', 'POSTING_CONFIG_FILE', 'POSTING_THEME_DIRECTORY', 'DOTFILES_DELTA_CONFIG']
alias_names = ['ls', 'e', 'y', 'cd', 'ed', 'lg', 'lzd']
[tests.expected.output]
environment = { XDG_CONFIG_HOME = '{config}', CODEX_HOME = '{config}/codex', YAZI_CONFIG_HOME = '{config}/yazi', GLOW_CONFIG_HOME = '{config}/glow', GH_CONFIG_DIR = '{config}/gh', MICRO_CONFIG_HOME = '{config}/micro', STARSHIP_CONFIG = '{config}/starship.toml', POSTING_CONFIG_FILE = '{config}/posting/config.yaml', POSTING_THEME_DIRECTORY = '{config}/posting/themes', DOTFILES_DELTA_CONFIG = '{config}/lazygit/delta.gitconfig' }
aliases = { ls = 'Invoke-Eza', e = 'Invoke-Yazi', y = 'Invoke-Yazi', cd = 'Set-LocationVenv', ed = 'micro', lg = 'lazygit', lzd = 'lazydocker' }
startup_errors = 0
startup_messages = []

