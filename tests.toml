# Run with Python 3.11+; fixtures are created in TEMP, never in the live config.
[[tests]]
id = 'powershell_syntax'
action = 'syntax'
[tests.input]
globs = ['install.ps1', 'powershell/*.ps1', 'powershell/modules/*.ps1', 'tests/*.ps1']
[tests.expected]
output = []

[[tests]]
id = 'private_files_stay_ignored'
action = 'git_ignore'
[tests.input]
private_paths = [
  '.env', '.env.local', 'unknown-app/config.json',
  'cagent/user-uuid', 'cagent/.cagent_first_run',
  'codex/auth.json', 'codex/config.toml', 'codex/sessions/session.jsonl', 'codex/state.sqlite',
  'gh/hosts.yml', 'gh/hosts.yaml', 'gh/config.yml.20261107.bak',
  'lazygit/state.yml', 'lazygit/github_pull_requests.json',
  'yazi/bookmark', 'yazi/bookmark.bak', 'yazi/history.json',
  'yazi/plugins/piper.yazi/.env', 'yazi/plugins/piper.yazi/history.json',
  'yazi/plugins/piper.yazi/main.lua.bak', 'yazi/plugins/unknown.yazi/main.lua',
  'micro/buffers/history', 'micro/backups/private.txt', 'micro/log.txt',
  'powershell/PSReadLine/ConsoleHost_history.txt', 'powershell/modules/private.ps1',
  'posting/collections/private.posting.yaml', 'posting/collection/private.yaml',
  'posting/history.sqlite3', 'posting/.env', 'posting/themes/private.yaml',
  'uv/uv-receipt.json', 'tests/__pycache__/run.pyc',
]
[tests.expected.output]
exposed_private = []
ignored_public = []

[[tests]]
id = 'publication_contains_complete_configuration'
action = 'repository_files'
[tests.expected.output]
missing = []
ignored = []
unexpected = []

[[tests]]
id = 'copy_only_settings'
action = 'copy_plan'
[tests.input.files]
'starship.toml' = 'configuration'
'gh/config.yml' = 'editor: micro'
'gh/hosts.yml' = 'private authentication'
'codex/auth.json' = 'private session'
'posting/collections/private.posting.yaml' = 'private request'
'posting/themes/private.yaml' = 'private extra file'
'yazi/bookmark' = 'private bookmark'
'yazi/plugins/piper.yazi/main.lua' = 'return {}'
'yazi/plugins/piper.yazi/credentials.yaml' = 'private data'
'yazi/plugins/piper.yazi/main.lua.bak' = 'old configuration'
'powershell/modules/aliases.ps1' = '# aliases'
'powershell/modules/private.ps1' = '# private script'
'micro/buffers/history' = 'editor history'
[tests.expected]
output = ['gh/config.yml', 'powershell/modules/aliases.ps1', 'starship.toml', 'yazi/plugins/piper.yazi/main.lua']

[[tests]]
id = 'copy_in_place_does_nothing'
action = 'copy_plan'
[tests.input]
same_roots = true
[tests.input.files]
'starship.toml' = 'configuration'
[tests.expected]
output = []

[[tests]]
id = 'backup_and_repeat_preserve_private_data'
action = 'install_config'
[tests.input]
repeat = 2
watch_paths = ['starship.toml', 'gh/hosts.yml', 'posting/collections/private.yaml']
backup_pattern = '*.bak'
[tests.input.source_files]
'starship.toml' = 'new settings'
'gh/hosts.yml' = 'source authentication must not be copied'
'posting/collections/private.yaml' = 'source collection must not be copied'
[tests.input.destination_files]
'starship.toml' = 'previous settings'
'gh/hosts.yml' = 'keep authentication'
'posting/collections/private.yaml' = 'keep collection'
[tests.expected]
output = [
  { files = { 'starship.toml' = 'new settings', 'gh/hosts.yml' = 'keep authentication', 'posting/collections/private.yaml' = 'keep collection' }, backup_count = 1, backup_contents = ['previous settings'] },
  { files = { 'starship.toml' = 'new settings', 'gh/hosts.yml' = 'keep authentication', 'posting/collections/private.yaml' = 'keep collection' }, backup_count = 1, backup_contents = ['previous settings'] },
]

[[tests]]
id = 'profile_path_escapes_apostrophe'
action = 'call'
[tests.input]
function = 'Get-DotfilesProfileLine'
[tests.input.parameters]
ConfigRoot = "C:\\Terminal's settings"
[tests.expected]
output = ". 'C:\\Terminal''s settings\\powershell\\init.ps1'"

[[tests]]
id = 'profile_repeat_does_not_duplicate'
action = 'call'
[tests.input]
function = 'Get-DotfilesProfileContent'
repeat = 2
feedback_parameter = 'Existing'
normalize_newlines = true
[tests.input.parameters]
ConfigRoot = 'C:\Settings'
Existing = '# existing profile'
[tests.expected]
output = "# existing profile\n. 'C:\\Settings\\powershell\\init.ps1'\n"

[[tests]]
id = 'profile_recognizes_equivalent_path'
action = 'call'
[tests.input]
function = 'Get-DotfilesProfileContent'
[tests.input.parameters]
ConfigRoot = 'C:\Settings'
Existing = ". 'c:/settings/powershell/init.ps1'\n"
[tests.expected]
output = ". 'c:/settings/powershell/init.ps1'\n"

[[tests]]
id = 'path_keeps_existing_entries'
action = 'call'
[tests.input]
function = 'Get-DotfilesPathEntries'
array = true
[tests.input.parameters]
ProcessPath = 'C:\Tools;C:\Windows;'
UserPath = 'c:\tools\;C:\UserBin'
MachinePath = 'C:\WINDOWS;C:\Program Files\Git\cmd'
AdditionalPaths = ['C:\UserBin', 'C:\Extra']
[tests.expected]
output = ['C:\Tools', 'C:\Windows', 'C:\UserBin', 'C:\Program Files\Git\cmd', 'C:\Extra']

[[tests]]
id = 'native_success'
action = 'native_result'
[tests.input]
command = 'MockInstaller'
exit_code = 0
[tests.expected.output]
Success = true
RebootRequired = false
VerifyInstalled = false

[[tests]]
id = 'native_reboot_required'
action = 'native_result'
[tests.input]
command = 'MockInstaller'
exit_code = 3010
[tests.expected.output]
Success = true
RebootRequired = true
VerifyInstalled = false

[[tests]]
id = 'native_error_stops_installation'
action = 'native_result'
[tests.input]
command = 'MockInstaller'
exit_code = 42
[tests.expected]
error = 'MockInstaller failed with exit code 42.'

[[tests]]
id = 'dry_run_root_entry'
action = 'dry_run'
[tests.input]
entry = 'install.ps1'
prohibited_commands = ['winget', 'uv', 'pwsh', 'Invoke-WebRequest', 'Add-AppxPackage', 'New-Item', 'Copy-Item', 'Unblock-File', 'Install-Module', 'Update-DotfilesProcessPath', 'Install-DotfilesWinGet', 'Install-DotfilesFont', 'Install-DotfilesConfiguration', 'Install-DotfilesProfile']
package_pattern = 'PLAN package (\S+)'
font_marker = 'PLAN font JetBrainsMono Nerd Font'
terminal_marker = 'PLAN terminal PowerShell 7 (dotfiles)'
profile_marker = 'PLAN profile'
[tests.expected.output]
