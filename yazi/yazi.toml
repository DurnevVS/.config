#:schema https://yazi-rs.github.io/schemas/yazi.json
# Yazi 26.9.1: local overrides merge with the built-in configuration.

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 4
max_width = 1000
max_height = 1000

[opener]
edit = [
  { run = "micro %s", desc = "Edit in micro", for = "windows", block = true },
]
markdown = [
  { run = "glow -p %s1", desc = "Read Markdown in Glow", for = "windows", block = true },
]

[open]
prepend_rules = [
  # A terminal text editor cannot open folders; use Explorer for this opener.
  # Right arrow / l still navigates into folders using the default bindings.
  { url = "*/", use = ["open", "reveal"] },
  { url = "*.{md,markdown,mdown,mkd}", use = ["edit", "markdown", "open", "reveal"] },
  { url = "*.{txt,log,toml,yaml,yml,json,jsonc,ini,conf,cfg,ps1,psm1,psd1,bat,cmd,lua,gitignore,gitattributes,editorconfig}", use = ["edit", "open", "reveal"] },
]

[[plugin.prepend_previewers]]
url = "*.{md,markdown,mdown,mkd}"
# Piper launches Git for Windows sh. TOML literal quotes preserve $w and $1.
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
